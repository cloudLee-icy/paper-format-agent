[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-format-agent"
version = "0.1.0"
description = "Template-driven academic DOCX formatter for journal and thesis manuscripts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Paper Format Agent Contributors" }
]
keywords = ["docx", "academic-writing", "thesis", "journal", "formatter"]
dependencies = [
  "python-docx>=1.1.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0"
]

[project.scripts]
paperfmt = "paper_format_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_format_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
